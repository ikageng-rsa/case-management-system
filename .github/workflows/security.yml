name: security

# composer-audit always reports (so it can be a required check) but only really runs when
# backend/** changed or on the weekly schedule. gitleaks always scans the whole repo, since
# a leaked secret can land in either app folder.
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'schedule'
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Set up PHP
        if: steps.filter.outputs.backend == 'true' || github.event_name == 'schedule'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Install Composer dependencies
        if: steps.filter.outputs.backend == 'true' || github.event_name == 'schedule'
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Composer audit
        if: steps.filter.outputs.backend == 'true' || github.event_name == 'schedule'
        working-directory: backend
        run: composer audit --no-interaction

      - name: No backend changes
        if: steps.filter.outputs.backend != 'true' && github.event_name != 'schedule'
        run: echo "No backend/** changes in this PR — skipping composer audit."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
