name: tests

# Runs on every PR/push to main and release/** so the required "tests" check always
# reports
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Set up PHP
        if: steps.filter.outputs.backend == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, bcmath
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: steps.filter.outputs.backend == 'true'
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Prepare environment
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Run migrations
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: php artisan migrate --force

      - name: Run tests (PHPUnit)
        if: steps.filter.outputs.backend == 'true'
        working-directory: backend
        run: php artisan test

      - name: No backend changes
        if: steps.filter.outputs.backend != 'true'
        run: echo "No backend/** changes in this PR — nothing to test."
